# ============================================================================
# bluestep-ai Release tagging
# ============================================================================
# Purpose: On every push to main, read every plugins/<name>/.claude-plugin/
#          plugin.json and, for each plugin whose `<name>-v<version>` tag
#          doesn't exist yet, create and push that tag and cut its GitHub
#          Release — so merging a version-bump PR is the whole release step.
#          One version stream per plugin. See the "Releasing" section of
#          README.md.
#          The bootstrap scripts (bootstrap/) are one more stream: the
#          version in bootstrap/version.json is tagged bootstrap-v<version>
#          with the same rules, and its Release (never "Latest") carries the
#          SHA-256 of each script and the commands pinned to that tag.
#
# Dual-path design (GITHUB_TOKEN caveat): tags pushed with the default
# GITHUB_TOKEN do NOT trigger other workflows — GitHub's recursive-workflow
# guard — so publish.yml's on:push:tags will never fire from this automation.
# This workflow therefore also creates the GitHub Release right after pushing
# each tag, using publish.yml's release-creation command (plus per-plugin
# notes range, title and "Latest" flag). publish.yml still serves the manual
# path: a human-pushed `<name>-vX.Y.Z` tag (pushed with the user's own
# credentials) triggers it as before, and simply pre-empts this workflow
# for that plugin (the tag-exists check below skips it).
#
# Legacy tags: before plugins/ existed, bluestep-tools lived at plugin/ and
# was tagged `plugin-v<version>`. Those tags count as released versions of
# bluestep-tools (no second tag for the same version) and seed its notes
# range until its first `bluestep-tools-v*` tag exists.
#
# Idempotent and race-safe: a plugin whose tag already exists is skipped and
# the loop goes on; a concurrent push of the same tag is detected and treated
# as success. Errors in one plugin don't stop the others: they are collected
# and fail the job after the loop. Never uses --force.
# ============================================================================

name: Release tag

on:
  push:
    branches: [main]
    # Deliberately NO paths filter on the manifests: this job is cheap, and a
    # paths filter could skip tagging when the version-bump commit lands as
    # part of a batch whose push event lists other files (merge commits can
    # confuse paths filters). Running always + the tag-exists check is the
    # simpler, safer idempotency mechanism.

# The ONLY bluestep-ai workflow with write access at the top level: it must push
# the release tags and create the GitHub Releases. Everything else in this
# repo (ci.yml validation; publish.yml elevates per-job) stays read-only.
permissions:
  contents: write

concurrency:
  group: release-tag-${{ github.ref }}
  cancel-in-progress: false  # Never cancel a half-done tag+release.

jobs:
  tag-and-release:
    name: Tag plugin and bootstrap versions and create Releases
    runs-on: ubuntu-latest
    steps:
      # Shallow checkout is enough: we tag the checked-out HEAD of main, and
      # tags are read from the remote via `git ls-remote --tags origin`, which
      # needs no local history or fetched tags. Unlike the other workflows,
      # credentials must persist so we can push the tags.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Tag each plugin and bootstrap version and create its Release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Tags on the remote, read once. A failed read fails the job: without
          # it we can't tell a released version from a new one.
          if ! REMOTE_TAGS="$(git ls-remote --tags --refs origin)"; then
            echo "::error::Cannot list the tags on origin — nothing can be tagged safely."
            exit 1
          fi
          tag_exists() {
            printf '%s\n' "$REMOTE_TAGS" | awk -v t="refs/tags/$1" '$2 == t { f = 1 } END { exit !f }'
          }
          # newest_tag PREFIX — the remote tag PREFIX<X.Y.Z[-pre]> with the
          # highest version (sort -V), or '' when there is none.
          newest_tag() {
            local v
            v="$(printf '%s\n' "$REMOTE_TAGS" \
              | awk -v p="refs/tags/$1" 'index($2, p) == 1 { print substr($2, length(p) + 1) }' \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' \
              | sort -V | tail -n 1)" || true
            [ -z "$v" ] || printf '%s%s' "$1" "$v"
          }
          # Same fs.readFileSync pattern as ci.yml (no require() module cache);
          # prints '' for a missing field, exits non-zero on invalid JSON.
          read_field() {
            node -e '
              try {
                const v = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))[process.argv[2]];
                process.stdout.write(v === undefined || v === null ? "" : String(v));
              } catch { process.exit(1); }' "$1" "$2"
          }

          FAILED=0
          SUMMARY=""
          # fail_plugin FILE MESSAGE — annotate, mark the job failed, keep looping.
          fail_plugin() {
            echo "::error file=$1::$2"
            FAILED=1
          }

          # Tag author: the github-actions bot.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for MANIFEST in plugins/*/.claude-plugin/plugin.json; do
            [ -f "$MANIFEST" ] || continue  # glob matched nothing
            DIR="${MANIFEST%/.claude-plugin/plugin.json}"
            FOLDER="${DIR#plugins/}"

            if ! NAME="$(read_field "$MANIFEST" name)" \
              || ! VERSION="$(read_field "$MANIFEST" version)"; then
              fail_plugin "$MANIFEST" "$FOLDER: $MANIFEST is not valid JSON — cannot tag"
              SUMMARY+="$FOLDER: FAIL manifest is not valid JSON"$'\n'
              continue
            fi
            if [ "$NAME" != "$FOLDER" ]; then
              fail_plugin "$MANIFEST" "$FOLDER: manifest name '${NAME:-<none>}' differs from its folder — cannot tag"
              SUMMARY+="$FOLDER: FAIL name '${NAME:-<none>}' != folder"$'\n'
              continue
            fi
            # X.Y.Z, optionally with a pre-release suffix (publish.yml's tag
            # glob accepts e.g. core-tools-v1.2.3-rc.1, so this must too).
            if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              fail_plugin "$MANIFEST" "$NAME: version '${VERSION:-<none>}' does not look like X.Y.Z — cannot tag"
              SUMMARY+="$NAME: FAIL version '${VERSION:-<none>}' is not X.Y.Z"$'\n'
              continue
            fi
            TAG="$NAME-v$VERSION"

            # Idempotency gate: the tag already exists on the remote (a
            # previous run, or a manual push that triggered publish.yml), so
            # this version is released. For bluestep-tools the legacy
            # plugin-v<version> tag counts too.
            if tag_exists "$TAG"; then
              SUMMARY+="$NAME $VERSION: tag $TAG exists, skipped"$'\n'
              continue
            fi
            if [ "$NAME" = "bluestep-tools" ] && tag_exists "plugin-v$VERSION"; then
              SUMMARY+="$NAME $VERSION: legacy tag plugin-v$VERSION exists, skipped"$'\n'
              continue
            fi

            # Notes start at this plugin's newest earlier release;
            # bluestep-tools falls back to its legacy plugin-v* tags. None
            # (a plugin's first release): generated notes would span from the
            # repo's previous Release, i.e. another plugin's, so write a short
            # note pointing at the plugin's own changelog instead.
            PREV="$(newest_tag "$NAME-v")"
            if [ -z "$PREV" ] && [ "$NAME" = "bluestep-tools" ]; then
              PREV="$(newest_tag "plugin-v")"
            fi
            if [ -n "$PREV" ]; then
              NOTES_ARGS=(--generate-notes --notes-start-tag "$PREV")
            else
              NOTES_ARGS=(--notes "First release of \`$NAME\` ($VERSION). What it is and how to install it: \`plugins/$NAME/README.md\`; changes from here on: \`plugins/$NAME/CHANGELOG.md\`.")
            fi
            # The repo's "Latest" release stays bluestep-tools'.
            if [ "$NAME" = "bluestep-tools" ]; then
              LATEST_ARGS=(--latest)
            else
              LATEST_ARGS=(--latest=false)
            fi

            git tag -a "$TAG" -m "$NAME $VERSION"

            # Never --force. If the push fails, re-check the remote: a
            # concurrent push of the same tag (e.g. a manual release racing
            # this run) is success, anything else is a real failure.
            if ! git push origin "refs/tags/$TAG"; then
              if [ -n "$(git ls-remote --tags origin "refs/tags/$TAG")" ]; then
                echo "::notice::Tag $TAG was pushed concurrently — nothing to do."
                SUMMARY+="$NAME $VERSION: tag $TAG pushed concurrently, skipped"$'\n'
                continue
              fi
              fail_plugin "$MANIFEST" "$NAME: failed to push tag $TAG"
              SUMMARY+="$NAME $VERSION: FAIL push of $TAG"$'\n'
              continue
            fi
            echo "Pushed tag $TAG."

            # GITHUB_TOKEN-pushed tags don't trigger publish.yml (see header),
            # so create the Release here, with publish.yml's exists-check.
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "::notice::Release $TAG already exists — skipping create"
              SUMMARY+="$NAME $VERSION: tagged $TAG, Release already existed"$'\n'
            elif gh release create "$TAG" --verify-tag \
              "${NOTES_ARGS[@]}" --title "$NAME $VERSION" "${LATEST_ARGS[@]}"; then
              SUMMARY+="$NAME $VERSION: tagged $TAG, Release created (notes ${PREV:+from }${PREV:-for a first release}, ${LATEST_ARGS[*]})"$'\n'
            else
              fail_plugin "$MANIFEST" "$NAME: tag $TAG pushed but creating its Release failed — create it by hand"
              SUMMARY+="$NAME $VERSION: FAIL Release for $TAG"$'\n'
            fi
          done

          # ---------------------------------------------------------------
          # The bootstrap scripts: one more version stream, read from
          # bootstrap/version.json and tagged bootstrap-v<version> with the
          # same rules as above (tag-exists skip, race-safe push, never
          # --force, errors collected). Its Release notes carry the SHA-256
          # of each script at the tag and the commands pinned to that tag.
          # ---------------------------------------------------------------
          BS_FILE="bootstrap/version.json"
          BS_PS1="bootstrap/bootstrap.ps1"
          BS_SH="bootstrap/bootstrap.sh"
          BS_RAW="https://raw.githubusercontent.com/${GITHUB_REPOSITORY:-Bluestep-Systems/bluestep-ai}"

          # blob_sha256 PATH — SHA-256 of the file as committed (the bytes
          # raw.githubusercontent.com serves), not of the working-tree copy.
          blob_sha256() {
            git cat-file blob "HEAD:$1" | sha256sum | awk '{ print $1 }'
          }

          # script_version FILE — the $ScriptVersion = '<v>' literal in the
          # .ps1 ('' when absent). Same regex as ci.yml's bootstrap-version job.
          script_version() {
            node -e '
              const m = /^[ \t]*\$ScriptVersion = \x27([^\x27]*)\x27/m.exec(require("fs").readFileSync(process.argv[1], "utf8"));
              process.stdout.write(m ? m[1] : "");' "$1"
          }

          # bootstrap_notes TAG VERSION — the Release body, on stdout.
          bootstrap_notes() {
            local tag="$1" ver="$2" url_ps1 url_sh h_ps1 h_sh
            url_ps1="$BS_RAW/$tag/$BS_PS1"
            url_sh="$BS_RAW/$tag/$BS_SH"
            h_ps1="$(blob_sha256 "$BS_PS1")"
            cat <<NOTES
          BlueStep machine bootstrap $ver. It installs the tools the BlueStep agent plugins need, per user and with no admin rights. Run it in your own terminal, never from an agent.

          ## SHA-256

          | File | SHA-256 |
          |---|---|
          | \`$BS_PS1\` | \`$h_ps1\` |
          NOTES
            if git cat-file -e "HEAD:$BS_SH" 2>/dev/null; then
              h_sh="$(blob_sha256 "$BS_SH")"
              echo "| \`$BS_SH\` | \`$h_sh\` |"
            fi
            cat <<NOTES

          ## Windows (PowerShell)

          One-liner:

          \`\`\`powershell
          irm $url_ps1 | iex
          \`\`\`

          With options (\`iex\` cannot pass parameters; a script block can):

          \`\`\`powershell
          & ([scriptblock]::Create((irm $url_ps1))) -DryRun
          \`\`\`

          Download, check the hash, read, run:

          \`\`\`powershell
          irm $url_ps1 -OutFile bootstrap.ps1
          if ((Get-FileHash .\\bootstrap.ps1 -Algorithm SHA256).Hash -eq '$h_ps1') { 'hash ok' } else { 'HASH MISMATCH - do not run it' }
          notepad .\\bootstrap.ps1
          powershell -NoProfile -ExecutionPolicy Bypass -File .\\bootstrap.ps1
          \`\`\`
          NOTES
            if [ -n "${h_sh:-}" ]; then
              cat <<NOTES

          ## macOS and Linux (bash)

          One-liner:

          \`\`\`bash
          curl -fsSL $url_sh | bash
          \`\`\`

          With options:

          \`\`\`bash
          curl -fsSL $url_sh | bash -s -- --dry-run
          \`\`\`

          Download, check the hash, read, run:

          \`\`\`bash
          curl -fsSLo bootstrap.sh $url_sh
          echo '$h_sh  bootstrap.sh' | shasum -a 256 -c -
          less bootstrap.sh
          bash bootstrap.sh
          \`\`\`
          NOTES
            fi
            if git cat-file -e "HEAD:bootstrap/README.md" 2>/dev/null; then
              printf '\nWhat a run does, how to undo it, supported platforms: [`bootstrap/README.md`](%s).\n' \
                "https://github.com/${GITHUB_REPOSITORY:-Bluestep-Systems/bluestep-ai}/blob/$tag/bootstrap/README.md"
            fi
          }

          if [ -f "$BS_FILE" ]; then
            BS_TAG=""
            if ! BS_VERSION="$(read_field "$BS_FILE" version)"; then
              fail_plugin "$BS_FILE" "bootstrap: $BS_FILE is not valid JSON — cannot tag"
              SUMMARY+="bootstrap: FAIL version.json is not valid JSON"$'\n'
            elif ! [[ "$BS_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              fail_plugin "$BS_FILE" "bootstrap: version '${BS_VERSION:-<none>}' does not look like X.Y.Z — cannot tag"
              SUMMARY+="bootstrap: FAIL version '${BS_VERSION:-<none>}' is not X.Y.Z"$'\n'
            elif ! git cat-file -e "HEAD:$BS_PS1" 2>/dev/null; then
              fail_plugin "$BS_FILE" "bootstrap: $BS_PS1 is missing — nothing to release"
              SUMMARY+="bootstrap $BS_VERSION: FAIL $BS_PS1 missing"$'\n'
            elif [ "$(script_version "$BS_PS1")" != "$BS_VERSION" ]; then
              # ci.yml blocks this on the PR; checked again so a mismatch is never tagged.
              fail_plugin "$BS_PS1" "bootstrap: \$ScriptVersion in $BS_PS1 differs from $BS_FILE ($BS_VERSION) — cannot tag"
              SUMMARY+="bootstrap $BS_VERSION: FAIL \$ScriptVersion mismatch"$'\n'
            else
              BS_TAG="bootstrap-v$BS_VERSION"
            fi

            if [ -n "$BS_TAG" ] && tag_exists "$BS_TAG"; then
              SUMMARY+="bootstrap $BS_VERSION: tag $BS_TAG exists, skipped"$'\n'
            elif [ -n "$BS_TAG" ]; then
              BS_NOTES="$(mktemp)"
              bootstrap_notes "$BS_TAG" "$BS_VERSION" > "$BS_NOTES"
              git tag -a "$BS_TAG" -m "bootstrap $BS_VERSION"
              # Never --force; a concurrent push of the same tag is success.
              if ! git push origin "refs/tags/$BS_TAG"; then
                if [ -n "$(git ls-remote --tags origin "refs/tags/$BS_TAG")" ]; then
                  echo "::notice::Tag $BS_TAG was pushed concurrently — nothing to do."
                  SUMMARY+="bootstrap $BS_VERSION: tag $BS_TAG pushed concurrently, skipped"$'\n'
                else
                  fail_plugin "$BS_FILE" "bootstrap: failed to push tag $BS_TAG"
                  SUMMARY+="bootstrap $BS_VERSION: FAIL push of $BS_TAG"$'\n'
                fi
              else
                echo "Pushed tag $BS_TAG."
                # Never "Latest": the repo's Latest release stays bluestep-tools'.
                if gh release view "$BS_TAG" >/dev/null 2>&1; then
                  echo "::notice::Release $BS_TAG already exists — skipping create"
                  SUMMARY+="bootstrap $BS_VERSION: tagged $BS_TAG, Release already existed"$'\n'
                elif gh release create "$BS_TAG" --verify-tag \
                  --notes-file "$BS_NOTES" --title "bootstrap $BS_VERSION" --latest=false; then
                  SUMMARY+="bootstrap $BS_VERSION: tagged $BS_TAG, Release created with the script hashes (--latest=false)"$'\n'
                else
                  fail_plugin "$BS_FILE" "bootstrap: tag $BS_TAG pushed but creating its Release failed — create it by hand"
                  SUMMARY+="bootstrap $BS_VERSION: FAIL Release for $BS_TAG"$'\n'
                fi
              fi
              rm -f "$BS_NOTES"
            fi
          fi

          printf '%s' "$SUMMARY"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            { echo '### Releases'; echo; printf '%s' "$SUMMARY" | sed 's/^/- /'; } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$FAILED"
        shell: bash
