# ============================================================================
# bspecs Release
# ============================================================================
# Purpose: On a plugin version tag (plugin-v*.*.*), create a GitHub Release.
#
# bspecs is distributed as a Claude Code plugin via the in-repo marketplace
# (.claude-plugin/marketplace.json) — there is no npm publish and no binary
# build. Tagging a version cuts a Release (users/marketplaces can pin to it).
# Plugin releases use the `plugin-vX.Y.Z` namespace to avoid colliding with the
# historic npm-package tags (`v0.2.0`..`v0.15.0`), which are frozen. The npm CLI
# is retained dormant in the repo but is no longer published.
# ============================================================================

name: Release

on:
  push:
    tags:
      - 'plugin-v[0-9]+.[0-9]+.[0-9]+*'  # plugin-v0.2.0, plugin-v1.2.3-rc.1, ...

# Least privilege at the top; the job elevates to contents: write to cut the release.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false  # Never cancel a release in progress.

jobs:
  # Create the GitHub Release for this tag (idempotent: skips if it already exists).
  # Closes the long-standing gap where published tags never got a Release object.
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Create release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release $TAG already exists — skipping create"
          else
            gh release create "$TAG" --verify-tag --generate-notes
          fi
        shell: bash
