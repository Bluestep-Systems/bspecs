# ============================================================================
# bspecs Publish
# ============================================================================
# Purpose: On a version tag (v*.*.*), validate then publish
#          @bluestep-systems/bspecs to the public npm registry with
#          provenance.
#
# Requires: an NPM_TOKEN repo secret (npm automation token with publish
#           rights to the @bluestep-systems scope). Provenance additionally
#           needs id-token: write, granted in-workflow below.
# ============================================================================

name: Publish

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'  # v0.1.0, v1.2.3, v1.2.3-rc.1, ...

# Least privilege: read the repo + mint an OIDC token for npm provenance.
permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false  # Never cancel a publish in progress.

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            npm ci --prefer-offline --no-audit && break
            echo "Attempt $i failed, retrying..."
            sleep 5
          done
        shell: bash

      # Guard against publishing a tag whose version doesn't match package.json.
      - name: Verify tag matches package.json version
        run: |
          set -euo pipefail
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi
          echo "::notice::Publishing version $PKG_VERSION"
        shell: bash

      # Smoke test: the CLI must start and print version + usage.
      - name: Smoke-run CLI (version)
        run: node cli.js -v

      - name: Smoke-run CLI (help)
        run: node cli.js -h

      # Scaffold a scratch project end-to-end and verify its layout.
      - name: Smoke-run scaffold
        run: node test-scaffold.mjs

      - name: Publish (provenance, public)
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
