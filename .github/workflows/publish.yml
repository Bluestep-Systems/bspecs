# ============================================================================
# bspecs Release
# ============================================================================
# Purpose: On a plugin version tag (<name>-vX.Y.Z), create a GitHub Release.
#
# bspecs is distributed as plugins (plugins/<name>/) via the in-repo
# marketplaces — there is no npm publish and no binary build. Tagging a
# version cuts a Release (users/marketplaces can pin to it). Each plugin has
# its own tag namespace, `<name>-vX.Y.Z` (bluestep-tools-v0.42.0,
# core-tools-v0.5.0, phi-guard-v0.1.0, ...). This is the manual path:
# release-tag.yml tags and releases on merge to main, but tags it pushes with
# GITHUB_TOKEN never trigger this workflow.
#
# The one pattern below also matches the legacy bluestep-tools tags
# `plugin-vX.Y.Z` (its leading `*` matches `plugin`), so a hand-pushed
# legacy tag still gets its Release. It does not match the historic
# npm-package tags (`v0.2.0`..`v0.15.0`, nothing before the `-v`), which
# are frozen. The npm CLI is retained dormant in the repo but is no longer
# published.
# ============================================================================

name: Release

on:
  push:
    tags:
      - '*-v[0-9]+.[0-9]+.[0-9]+*'  # core-tools-v0.5.0, phi-guard-v1.2.3-rc.1, plugin-v0.41.0, ...

# Least privilege at the top; the job elevates to contents: write to cut the release.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false  # Never cancel a release in progress.

jobs:
  # Create the GitHub Release for this tag (idempotent: skips if it already exists).
  # Closes the long-standing gap where published tags never got a Release object.
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Create release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release $TAG already exists — skipping create"
          else
            gh release create "$TAG" --verify-tag --generate-notes
          fi
        shell: bash
