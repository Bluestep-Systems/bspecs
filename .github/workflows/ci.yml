# ============================================================================
# bspecs CI
# ============================================================================
# Purpose: Validate the scaffolder on pull requests and pushes to the default
#          branch. bspecs is plain ESM JS with no build/test suite, so this is
#          a smoke check: the CLI must start and print version/help, and a
#          scratch scaffold must succeed. No secrets — the @bluestep-systems
#          scope resolves from public npm via .npmrc.
#          The cross-tool-drift job regenerates the committed Cursor/Codex
#          output and fails if it doesn't match what's checked in.
# ============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: read-only is all validation needs.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (Node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false  # See results across all Node versions, not just the first failure.
      matrix:
        node: ['18', '20', '22']  # engines floor (>=18) through current maintenance LTS.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            npm ci --prefer-offline --no-audit && break
            echo "Attempt $i failed, retrying..."
            sleep 5
          done
        shell: bash

      # Smoke test: the CLI must start and print version + usage.
      - name: Smoke-run CLI (version)
        run: node cli.js -v

      - name: Smoke-run CLI (help)
        run: node cli.js -h

      # Plugin distribution: the marketplace + plugin manifests must be valid JSON.
      - name: Validate plugin manifests
        run: |
          node -e "JSON.parse(require('fs').readFileSync('.claude-plugin/marketplace.json','utf8')); console.log('marketplace.json OK')"
          node -e "JSON.parse(require('fs').readFileSync('plugin/.claude-plugin/plugin.json','utf8')); console.log('plugin.json OK')"
        shell: bash

  # Drift gate: the Cursor/Codex output (dist/, .cursor-plugin/, .agents/) is
  # generated from plugin/** and committed. Regenerate it and fail if the result
  # differs from what's checked in — stale or hand-edited output can't merge.
  cross-tool-drift:
    name: Cross-tool output drift check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The generator is dependency-free (plain Node ESM), so no npm ci needed.
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Regenerate cross-tool output
        run: npm run gen

      # Two checks: git diff catches changes to tracked files; git status
      # catches brand-new generated files, which never show in git diff.
      - name: Fail on drift
        run: |
          set -euo pipefail
          GEN_PATHS="dist/ .cursor-plugin/ .agents/"

          if ! git diff --exit-code -- $GEN_PATHS; then
            echo "::error::Generated output is stale. Run 'npm run gen' and commit the result (dist/, .cursor-plugin/, .agents/)."
            exit 1
          fi

          UNTRACKED="$(git status --porcelain -- $GEN_PATHS)"
          if [ -n "$UNTRACKED" ]; then
            echo "$UNTRACKED"
            echo "::error::Generated output includes uncommitted files. Run 'npm run gen' and commit the result (dist/, .cursor-plugin/, .agents/)."
            exit 1
          fi
          echo "Generated output matches plugin/**. OK."
        shell: bash

      # Structural self-test + Claude-ism denylist lint on the emitted trees.
      - name: Run generator checks
        run: npm run gen:check

  # Release gate: any PR that changes plugin/** or tools/gen-cross-tool/** must
  # bump the plugin version, or installed users never receive the change (all
  # tools skip an unchanged version on update — an emitter-only fix still needs
  # the bump so regenerated output ships). See the "Releasing" section of
  # README.md.
  plugin-version-bump:
    name: Plugin version bump check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need base + head to compare the manifest across the PR
          persist-credentials: false

      - name: Require a version bump when plugin/** or tools/gen-cross-tool/** changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          MANIFEST="plugin/.claude-plugin/plugin.json"

          # Compare against the merge-base so we evaluate only THIS PR's own
          # changes. A two-dot "git diff BASE HEAD" would also flag commits main
          # gained after this branch was cut, misattributing them to the PR.
          MB="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"

          # Both paths gate the version: plugin/** is the shipped content, and
          # tools/gen-cross-tool/** changes what dist/ output ships to
          # Cursor/Codex installs (single shared version stream).
          if git diff --name-only "$MB" "$HEAD_SHA" | grep -qE '^(plugin/|tools/gen-cross-tool/)'; then
            echo "plugin/** or tools/gen-cross-tool/** changed in this PR — a version bump is required."
          else
            echo "No plugin/** or tools/gen-cross-tool/** changes — version bump not required."
            exit 0
          fi

          # Read the manifest version at a given ref (empty if absent/unparseable).
          # fs.readFileSync (not require) avoids Node's module cache across calls.
          read_ver() {
            git show "$1:$MANIFEST" 2>/dev/null > /tmp/m.json || echo '{}' > /tmp/m.json
            node -e "const fs=require('fs');try{process.stdout.write((JSON.parse(fs.readFileSync('/tmp/m.json','utf8')).version)||'')}catch(e){process.stdout.write('')}"
          }

          BASE_VER="$(read_ver "$MB")"
          HEAD_VER="$(read_ver "$HEAD_SHA")"
          echo "version: merge-base='${BASE_VER:-<none>}' head='${HEAD_VER:-<none>}'"

          if [ -z "$HEAD_VER" ]; then
            echo "::error file=$MANIFEST::No \"version\" field. This repo uses explicit plugin versions — add and bump it (see README 'Releasing')."
            exit 1
          fi
          if [ "$BASE_VER" = "$HEAD_VER" ]; then
            echo "::error file=$MANIFEST::plugin/** or tools/gen-cross-tool/** changed but version is still $HEAD_VER. Bump it so installed users receive the update (see README 'Releasing')."
            exit 1
          fi
          echo "Version bumped ${BASE_VER:-<none>} -> $HEAD_VER. OK."
        shell: bash
