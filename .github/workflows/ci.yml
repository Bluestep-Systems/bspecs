# ============================================================================
# bspecs CI
# ============================================================================
# Purpose: Validate the scaffolder on pull requests and pushes to the default
#          branch. bspecs is plain ESM JS with no build/test suite, so this is
#          a smoke check: the CLI must start and print version/help, and a
#          scratch scaffold must succeed. No secrets — the @bluestep-systems
#          scope resolves from public npm via .npmrc.
# ============================================================================

name: CI

on:
  push:
    branches: [master]
  pull_request:

# Least privilege: read-only is all validation needs.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (Node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false  # See results across all Node versions, not just the first failure.
      matrix:
        node: ['18', '20', '22']  # engines floor (>=18) through current maintenance LTS.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            npm ci --prefer-offline --no-audit && break
            echo "Attempt $i failed, retrying..."
            sleep 5
          done
        shell: bash

      # Smoke test: the CLI must start and print version + usage.
      - name: Smoke-run CLI (version)
        run: node cli.js -v

      - name: Smoke-run CLI (help)
        run: node cli.js -h

      # Scaffold a scratch project end-to-end and verify its layout.
      - name: Smoke-run scaffold
        run: node test-scaffold.mjs

  # Build the SEA binary on Linux (SEA needs Node 20+) so bundling / embedding
  # breakage is caught at PR time, not only at release (publish.yml builds the
  # shipped win/mac assets). No upload here. We don't distribute a Linux binary —
  # it's purely a build smoke. The esbuild bundle is identical across OSes, so a
  # Linux build exercises the import.meta shim, version injection, and template
  # embedding that the shipped binaries depend on.
  binary:
    name: Binary build smoke (Linux SEA)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit
        shell: bash

      - name: Build binary
        run: npm run build:binary
        shell: bash

      # The binary must start and report the package.json version — proving the
      # build-time version injection works inside the real SEA, not just `node cli.js`.
      - name: Smoke-run binary
        run: |
          set -euo pipefail
          ACTUAL="$(./build/bspecs -v)"
          EXPECTED="$(node -p "require('./package.json').version")"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Binary version '$ACTUAL' does not match package.json '$EXPECTED'"
            exit 1
          fi
          ./build/bspecs -h | head -1
          echo "::notice::binary reports version $ACTUAL"
        shell: bash

      # Embedded-template guard: the build only proves templates were bundled, not
      # that the embedded READ path in utils.js scaffolds correctly. Swap the dev
      # stub for a generated embed module, run the full scaffold test through it,
      # then restore. This is the only automated check of the embedded read branch.
      - name: Embedded-template scaffold guard
        run: |
          set -euo pipefail
          node -e '
            const { readdirSync, statSync, readFileSync, writeFileSync } = require("fs");
            const { join } = require("path");
            const map = {};
            const walk = (d, r) => {
              for (const e of readdirSync(d)) {
                const a = join(d, e), rel = r ? r + "/" + e : e;
                statSync(a).isDirectory() ? walk(a, rel) : (map[rel] = readFileSync(a, "utf8"));
              }
            };
            walk("templates", "");
            writeFileSync("src/templates-embed.js", "export function getEmbeddedTemplates(){return " + JSON.stringify(map) + ";}\n");
            console.log("embedded " + Object.keys(map).length + " templates");
          '
          node test-scaffold.mjs
          git checkout -- src/templates-embed.js
        shell: bash
